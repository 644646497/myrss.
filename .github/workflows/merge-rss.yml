name: DW 中文全文 RSS

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'   # 每30分钟

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install trafilatura feedgenerator requests feedparser

      - name: Generate Full-text RSS
        run: python dw_fulltext_rss.py

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 如果有改动就提交，没有就直接成功退出
          git add feed.xml
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          git commit -m "Update DW full-text RSS $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
        continue-on-error: false
