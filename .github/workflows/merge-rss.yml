name: IT之家RSS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download RSS
        run: |
          curl -L "https://www.ithome.com/rss/" -o feed.xml

      - name: Commit RSS
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add feed.xml
          git commit -m "update rss" || exit 0
          git push
