name: Pengpai RSS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download RSS
        run: |
          curl -L "https://www.thepaper.cn/rss_newsDetail_forward_1739814" -o feed.xml

      - name: Commit RSS
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add feed.xml
          git commit -m "update pengpai rss" || exit 0
          git push
