name: DW 中文全文 RSS

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install trafilatura feedgenerator requests feedparser

      - name: Generate Full-text RSS
        run: python dw_fulltext_rss.py

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          git commit -m "Update DW full-text RSS $(date -u +'%Y-%m-%d %H:%M UTC')" || exit 0
          git push
