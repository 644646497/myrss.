name: Simple China News RSS
on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ultra-simple RSS script
        run: |
          cat > rss.xml << 'EOF'
<?xml version="1.0" encoding="UTF-8"?>
<rss version="2.0">
  <channel>
    <title>国内新闻聚合 - 极简版</title>
    <link>https://github.com/${{ github.repository }}</link>
    <description>国内稳定可用的新闻源聚合</description>
    <lastBuildDate>$(date -u +"%a, %d %b %Y %H:%M:%S GMT")</lastBuildDate>
    <item>
      <title>澎湃新闻首页</title>
      <link>https://www.thepaper.cn/</link>
      <description>国内深度新闻平台</description>
      <pubDate>$(date -u +"%a, %d %b %Y %H:%M:%S GMT")</pubDate>
    </item>
    <item>
      <title>中国新闻网首页</title>
      <link>https://www.chinanews.com/</link>
      <description>中国新闻网官方网站</description>
      <pubDate>$(date -u +"%a, %d %b %Y %H:%M:%S GMT")</pubDate>
    </item>
  </channel>
</rss>
EOF

      - name: Commit and push
        uses: EndBug/add-and-commit@v9
        with:
          message: "Update simple RSS feed"
          add: "rss.xml"
