name: Update China News RSS

on:
  workflow_dispatch:  # 仅保留手动触发，方便调试
  # schedule:
  #   - cron: '*/30 * * * *'  # 调试通过后再打开定时

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests

      - name: 运行脚本（带详细日志）
        run: |
          set -x
          ls -la
          python merge_rss.py
        shell: bash

      - name: 检查生成的文件
        run: |
          ls -la
          cat rss.xml | head -20

      - name: 提交更新
        uses: EndBug/add-and-commit@v9
        with:
          message: "Update RSS feed"
          add: "rss.xml"
          default_author: github_actions
