name: DW Chinese Full RSS

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install feedparser
        run: pip install feedparser requests beautifulsoup4 lxml

      - name: Generate Full RSS
        run: |
          python << 'EOF'
          import feedparser
          import requests
          from bs4 import BeautifulSoup
          from xml.sax.saxutils import escape

          rss_url = "https://rss.dw.com/xml/rss-chi-all"

          feed = feedparser.parse(rss_url)

          items = []

          for entry in feed.entries[:10]:
              try:
                  html = requests.get(entry.link, timeout=20).text
                  soup = BeautifulSoup(html, "html.parser")

                  content = ""

                  article = soup.find("div", class_="rich-text")
                  if article:
                      content = article.get_text("\n")

                  item = f"""
                  <item>
                  <title>{escape(entry.title)}</title>
                  <link>{entry.link}</link>
                  <description><![CDATA[{content}]]></description>
                  </item>
                  """

                  items.append(item)

              except Exception as e:
                  print(e)

          rss = f"""<?xml version="1.0" encoding="UTF-8"?>
          <rss version="2.0">
          <channel>
          <title>DW Chinese Full RSS</title>
          <link>https://dw.com</link>
          <description>DW Full Text RSS</description>

          {''.join(items)}

          </channel>
          </rss>
          """

          with open("feed.xml", "w", encoding="utf-8") as f:
              f.write(rss)

          EOF

      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add feed.xml
          git commit -m "update dw full rss" || exit 0
          git push
