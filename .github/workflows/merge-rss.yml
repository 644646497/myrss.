name: Nikkei & China News RSS
on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate static RSS feed
        run: |
          cat > rss.xml << 'EOF'
<?xml version="1.0" encoding="UTF-8"?>
<rss version="2.0">
  <channel>
    <title>日经中文网 + 国内新闻聚合</title>
    <link>https://github.com/644646497/myrss.</link>
    <description>包含日经中文网、澎湃新闻、中国新闻网的稳定RSS源</description>
    <lastBuildDate>$(date -u +"%a, %d %b %Y %H:%M:%S GMT")</lastBuildDate>

    <!-- 日经中文网 -->
    <item>
      <title>日经中文网 - 首页</title>
      <link>https://cn.nikkei.com/</link>
      <description>日经中文网官方首页，提供中日经济、产业与市场动态报道</description>
      <pubDate>$(date -u +"%a, %d %b %Y %H:%M:%S GMT")</pubDate>
    </item>

    <!-- 澎湃新闻 -->
    <item>
      <title>澎湃新闻 - 首页</title>
      <link>https://www.thepaper.cn/</link>
      <description>国内深度时政与社会新闻平台</description>
      <pubDate>$(date -u +"%a, %d %b %Y %H:%M:%S GMT")</pubDate>
    </item>

    <!-- 中国新闻网 -->
    <item>
      <title>中国新闻网 - 首页</title>
      <link>https://www.chinanews.com/</link>
      <description>中国新闻网官方首页，提供权威、及时的新闻报道</description>
      <pubDate>$(date -u +"%a, %d %b %Y %H:%M:%S GMT")</pubDate>
    </item>
  </channel>
</rss>
EOF

      - name: Commit RSS file
        uses: EndBug/add-and-commit@v9
        with:
          message: "Update static RSS feed with Nikkei CN"
          add: "rss.xml"
