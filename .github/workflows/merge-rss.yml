name: 抓取 RSS
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: 抓取 RSS
        run: |
          curl -L -s "https://feeds.feedburner.com/chinadigitaltimes/IyPt" > feed.xml
          echo "抓取完成"
      
      - name: 提交更新
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add feed.xml
          git diff --quiet && git diff --staged --quiet || git commit -m "更新RSS"
          git push
